name: readme-atelier cards

on:
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours

# Required: the action force-pushes the rendered SVGs to this repo's
# `output` branch. Without contents:write the push fails with a 403.
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pin to the released tag, not to a branch. `@main` moves with every
      # push, so a branch ref means this workflow silently adopts whatever
      # landed there since it last ran -- including changes nobody reviewed
      # against your config. This line said `@main` because it was written
      # before v1 was tagged; the README has said `@v1` since.
      # Replace the owner/repo below if you are running your own fork.
      - uses: WayneLY-Chen/Readme-Atelier@v1
        with:
          github-token: ${{ github.token }}
          config-path: widgets.yml
