name: "Readme-Atelier"
description: >-
  Renders GitHub profile README cards to SVG and publishes them to this
  repository's `output` branch.
branding:
  icon: "layout"
  color: "orange"
inputs:
  github-token:
    required: true
    description: >-
      Token used to push rendered cards to the `output` branch. Pass the
      workflow's built-in github.token; no personal access token is required.
      (Written without expression syntax on purpose - GitHub evaluates every
      expression in this file, and the `github` context does not exist here, so
      writing it literally makes the whole action fail to load.)
  config-path:
    required: false
    default: "widgets.yml"
    description: >-
      Path to this repository's widgets.yml. Defaults to widgets.yml at the
      repository root. If the file does not exist, built-in defaults are used
      and printed to the run's log and job summary.
  profile-login:
    required: false
    description: >-
      GitHub username whose profile data (contributions, stars, repositories)
      the cards should query. Optional on repositories owned by a personal
      account - defaults to the repository owner, same as before this input
      existed. Required in practice on an organization-owned repository:
      GitHub's GraphQL API can only look up a User's profile, never an
      Organization's, so the repository owner cannot be queried directly in
      that case - set this to your own GitHub username instead.
runs:
  using: "node24"
  main: "dist/index.js"
