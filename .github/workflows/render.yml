name: render
on:
  workflow_call:
    inputs:
      config-path:
        description: "Path to widgets.yml in the caller repository"
        type: string
        required: false
        default: "widgets.yml"

# Declared here only as documentation of the minimum requirement. The
# permission chain can only be downgraded, never elevated, by a called
# reusable workflow - the declaration that actually takes effect must live
# in the caller's own workflow file (see the adopter template in
# 05-RESEARCH.md Pattern 1 / README).
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # The github context (and therefore this checkout) is always associated
      # with the CALLER workflow - this checks out the adopter's repository,
      # the one with widgets.yml in it, not this repository.
      - uses: actions/checkout@v5
      # Cross-repo pitfall: `uses: ./` resolves against the caller's checkout,
      # not this repository, and would fail to find action.yml entirely.
      # `uses:` also cannot take an expression, so this is written literally
      # and moves in lockstep with this file's own `@v1` tag on release.
      - uses: WayneLY-Chen/Readme-Atelier@v1
        with:
          github-token: ${{ github.token }}
          config-path: ${{ inputs.config-path }}
