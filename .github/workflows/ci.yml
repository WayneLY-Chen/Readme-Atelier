name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  dist-staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Cheap PR-time layer for the same Phase 4 stale-dist failure mode
      # release.yml guards - catches drift before a release is even cut,
      # and doubles as a free rebuild-determinism check (Pitfall 5).
      - run: git diff --exit-code dist/
