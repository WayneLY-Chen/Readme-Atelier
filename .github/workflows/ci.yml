name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Until this job existed, nothing on CI ran the test suite at all - ci.yml
  # only checked dist/ staleness, so whether the 495 tests passed depended
  # entirely on each developer remembering to run them locally. CONTRIBUTING.md
  # tells contributors to run `npm test`; this is what actually holds them to it
  # on a pull request.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # No GITHUB_TOKEN is injected on purpose: the whole suite must stay
      # hermetic. A test that only passes when a token happens to be present in
      # the environment is worse than no test - it reports green for the wrong
      # reason (see src/cli.e2e.test.ts's header comment).
      - run: npm test

  dist-staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Cheap PR-time layer for the same Phase 4 stale-dist failure mode
      # release.yml guards - catches drift before a release is even cut,
      # and doubles as a free rebuild-determinism check (Pitfall 5).
      - run: git diff --exit-code dist/
